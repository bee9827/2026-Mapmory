name: iOS CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect iOS changes
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.filter.outputs.ios }}

    steps:
      - name: Checkout source
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v7

      - name: Detect iOS-related paths
        if: github.event_name != 'workflow_dispatch'
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ios:
              - '.github/workflows/ios-ci.yml'
              - 'client/iosApp/**'
              - 'client/shared/**'
              - 'client/gradle/**'
              - 'client/build.gradle.kts'
              - 'client/settings.gradle.kts'
              - 'client/gradle.properties'
              - 'client/gradlew'
              - 'client/gradlew.bat'

  ios:
    name: Build iOS Simulator
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.ios == 'true'
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check Xcode
        run: xcodebuild -version

      - name: Build iOS Simulator app
        run: |
          xcodebuild \
            -project client/iosApp/Mapmory.xcodeproj \
            -scheme Mapmory \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/mapmory-derived-data" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
