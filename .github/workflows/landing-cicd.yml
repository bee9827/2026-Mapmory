name: Landing CI

on:
  pull_request:
    paths:
      - "landing/**"
      - ".github/workflows/landing-cicd.yml"
  push:
    branches: [main]
    paths:
      - "landing/**"
      - ".github/workflows/landing-cicd.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: landing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: landing

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: landing/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build landing page
        run: npm run build

      - name: Run landing tests
        run: npm run test:sites
