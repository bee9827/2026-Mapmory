<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mapmory Onboarding</title>
  <style>
    :root {
      --canvas: #0b141a;
      --surface: #121d24;
      --surface-raised: #1a262f;
      --surface-high: #202d36;
      --text: #f0fff8;
      --muted: #b9cbbc;
      --muted-2: #849587;
      --accent: #21e69a;
      --accent-soft: #9affcf;
      --line: #34434b;
      --radius-card: 20px;
      --radius-button: 14px;
      --font: "Be Vietnam Pro", "Pretendard", "Apple SD Gothic Neo", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 390px;
      background: #071015;
      color: var(--text);
      font-family: var(--font);
    }

    .canvas {
      display: flex;
      gap: 32px;
      min-height: 100vh;
      padding: 40px;
      overflow-x: auto;
      align-items: flex-start;
    }

    .screen {
      position: relative;
      flex: 0 0 390px;
      width: 390px;
      height: 844px;
      overflow: hidden;
      background: var(--canvas);
    }

    .skip {
      position: absolute;
      z-index: 2;
      top: 28px;
      right: 24px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
      line-height: 20px;
      text-decoration: none;
    }

    .screen-content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: 92px 24px 24px;
    }

    .screen-1 .screen-content { padding-top: 96px; }

    .screen-title {
      margin: 0;
      color: var(--text);
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -1.2px;
      line-height: 1.28;
      text-align: center;
    }

    .screen-description {
      margin: 16px 0 0;
      color: var(--text);
      font-size: 17px;
      font-weight: 400;
      letter-spacing: -0.5px;
      line-height: 1.65;
      text-align: center;
      word-break: keep-all;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 24px;
      margin-top: auto;
    }

    .indicators {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .indicator {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: #3d464f;
    }

    .indicator.active { background: var(--accent); }

    .primary-button {
      width: 100%;
      min-height: 58px;
      border: 0;
      border-radius: var(--radius-button);
      background: var(--accent);
      color: #071c15;
      font: inherit;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.4px;
      cursor: pointer;
    }

    .button-arrow {
      display: inline-block;
      margin-left: 8px;
      font-size: 28px;
      line-height: 0;
      vertical-align: -2px;
    }

    /* Screen 1: map-first introduction */
    .world-map {
      width: calc(100% + 48px);
      margin: 36px -24px 0;
    }

    .world-map img {
      display: block;
      width: 100%;
      height: auto;
    }

    .map-copy { margin-top: auto; }

    .map-copy .screen-description { color: var(--muted); }

    /* Screen 2: photo first, copy second */
    .screen-2 .screen-content { padding-top: 86px; }

    .memory-photo {
      position: relative;
      height: 300px;
      margin: 28px 0 26px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius-card);
      background: var(--surface-raised);
    }

    .memory-photo::after {
      position: absolute;
      right: 18px;
      bottom: 16px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(7, 16, 21, 0.76);
      color: var(--text);
      content: "여행 기록 미리보기";
      font-size: 10px;
      font-weight: 600;
    }

    .memory-photo svg { display: block; width: 100%; height: 100%; }

    .screen-2 .screen-title { font-size: 27px; }

    .screen-2 .screen-description {
      margin-top: 14px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }

    .detail-list {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 18px;
    }

    .detail-chip {
      padding: 6px 10px;
      border: 1px solid #46545a;
      border-radius: 999px;
      color: var(--muted);
      font-size: 11px;
      line-height: 16px;
    }

    /* Screen 3: a more ownable memory illustration */
    .memory-illustration {
      display: grid;
      place-items: center;
      height: 300px;
      margin: 56px 0 34px;
      border: 1px solid var(--line);
      border-radius: var(--radius-card);
      background: var(--surface-raised);
    }

    .memory-illustration svg { width: 216px; height: 216px; }

    .screen-3 .screen-title { font-size: 27px; }

    .screen-3 .screen-description {
      margin-top: 14px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }

    @media (max-width: 480px) {
      .canvas { gap: 0; padding: 0; }
      .screen { flex-basis: 100vw; width: 100vw; }
    }

    /* Add ?screen=1, ?screen=2, or ?screen=3 when importing one frame at a time. */
    html[data-screen] .canvas {
      width: 390px;
      min-height: 844px;
      padding: 0;
      gap: 0;
      overflow: hidden;
    }

    html[data-screen="1"] .screen:not(.screen-1),
    html[data-screen="2"] .screen:not(.screen-2),
    html[data-screen="3"] .screen:not(.screen-3) {
      display: none;
    }
  </style>
</head>
<body>
  <main class="canvas" aria-label="Mapmory 온보딩 화면 3개">
    <section class="screen screen-1" aria-label="온보딩 1번 화면">
      <a class="skip" href="#start">건너뛰기</a>
      <div class="screen-content">
        <div class="world-map" aria-label="여행 기록이 표시된 상세 세계 지도">
          <img src="assets/map-detail.png" alt="대륙 윤곽과 여행 기록 핀이 표시된 세계 지도">
        </div>

        <div class="map-copy">
          <h1 class="screen-title">여행을 지도에 남겨보세요</h1>
          <p class="screen-description">Mapmory와 함께라면 당신의 모든 여행이 지도가 됩니다.<br>다녀온 지역을 하나씩 채워보세요.</p>
        </div>

        <div class="actions">
          <div class="indicators" aria-label="1번째 화면, 전체 3개">
            <span class="indicator active"></span><span class="indicator"></span><span class="indicator"></span>
          </div>
          <button class="primary-button" type="button">다음 <span class="button-arrow">→</span></button>
        </div>
      </div>
    </section>

    <section class="screen screen-2" aria-label="온보딩 2번 화면">
      <a class="skip" href="#start">건너뛰기</a>
      <div class="screen-content">
        <div class="memory-photo" aria-label="여행 사진과 기록 미리보기">
          <svg viewBox="0 0 342 300" role="img" aria-hidden="true">
            <rect width="342" height="300" fill="#172f35"/>
            <circle cx="263" cy="80" r="42" fill="#e9b46a"/>
            <path d="M0 203 71 133 121 184 168 131 245 206 290 166 342 215V300H0Z" fill="#205c58"/>
            <path d="M0 231 62 184 104 215 157 173 228 235 276 198 342 241V300H0Z" fill="#153b42"/>
            <path d="M0 258 74 226 132 251 189 217 259 264 309 236 342 254V300H0Z" fill="#10272f"/>
            <path d="M25 271c52-28 98-19 144 0s94 28 148-1" fill="none" stroke="#21e69a" stroke-width="3" opacity=".7"/>
            <g transform="translate(22 22)">
              <rect width="106" height="34" rx="17" fill="#071015" opacity=".8"/>
              <circle cx="18" cy="17" r="5" fill="#21e69a"/>
              <text x="32" y="22" fill="#f0fff8" font-family="sans-serif" font-size="12" font-weight="600">여행의 한 장면</text>
            </g>
            <g transform="translate(232 230)">
              <rect width="88" height="46" rx="12" fill="#071015" opacity=".84"/>
              <text x="16" y="20" fill="#b9cbbc" font-family="sans-serif" font-size="10">여수 · 2026.08</text>
              <text x="16" y="36" fill="#21e69a" font-family="sans-serif" font-size="10" font-weight="700">기록 남기기</text>
            </g>
          </svg>
        </div>

        <h1 class="screen-title">지역을 선택하고<br>여행을 기록해요</h1>
        <p class="screen-description">국가와 행정구역을 선택하고, 그곳에서의<br>특별한 추억을 기록으로 남길 수 있습니다.</p>
        <div class="detail-list" aria-label="기록에 포함할 수 있는 정보">
          <span class="detail-chip">장소</span><span class="detail-chip">날짜</span><span class="detail-chip">이야기</span>
        </div>

        <div class="actions">
          <div class="indicators" aria-label="2번째 화면, 전체 3개">
            <span class="indicator"></span><span class="indicator active"></span><span class="indicator"></span>
          </div>
          <button class="primary-button" type="button">다음</button>
        </div>
      </div>
    </section>

    <section class="screen screen-3" id="start" aria-label="온보딩 3번 화면">
      <a class="skip" href="#start">건너뛰기</a>
      <div class="screen-content">
        <div class="memory-illustration" aria-label="사진을 나중에 추가할 수 있음을 나타내는 여행 기록 일러스트">
          <svg viewBox="0 0 216 216" role="img" aria-hidden="true">
            <rect x="28" y="37" width="113" height="99" rx="22" fill="#263940" stroke="#f0fff8" stroke-width="8"/>
            <circle cx="61" cy="70" r="12" fill="#9aa8a1"/>
            <path d="m42 119 28-28 20 18 32-32 28 29v29H42Z" fill="#9aa8a1"/>
            <path d="M133 50v32M117 66h32" stroke="#21e69a" stroke-width="8" stroke-linecap="round"/>
            <path d="M147 139 98 178" stroke="#7bf5bd" stroke-width="5" stroke-linecap="round" stroke-dasharray="5 10"/>
            <path d="m95 168 4 18 17-8" fill="none" stroke="#7bf5bd" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M168 119c0 23-22 35-22 35s-22-12-22-35a22 22 0 1 1 44 0Z" fill="#21e69a"/>
            <circle cx="146" cy="119" r="7" fill="#071c15"/>
            <circle cx="173" cy="174" r="24" fill="#21e69a"/>
            <path d="M173 161v15l10 7" fill="none" stroke="#071c15" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>

        <h1 class="screen-title">사진은 나중에<br>추가해도 괜찮아요</h1>
        <p class="screen-description">꼭 사진이 없어도 괜찮습니다. 당신의 진솔한 기록만으로도<br>충분히 소중한 지도가 완성됩니다.</p>

        <div class="actions">
          <div class="indicators" aria-label="3번째 화면, 전체 3개">
            <span class="indicator"></span><span class="indicator"></span><span class="indicator active"></span>
          </div>
          <button class="primary-button" type="button">시작하기</button>
        </div>
      </div>
    </section>
  </main>
  <script>
    const requestedScreen = new URLSearchParams(window.location.search).get("screen");
    if (["1", "2", "3"].includes(requestedScreen)) {
      document.documentElement.dataset.screen = requestedScreen;
    }
  </script>
</body>
</html>
