<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=390, initial-scale=1">
  <title>Mapmory 온보딩 1</title>
  <style>
    :root {
      --canvas: #0b141a;
      --surface: #121d24;
      --text: #f0fff8;
      --muted: #b9cbbc;
      --accent: #21e69a;
      --inactive: #3d464f;
      --button-text: #071c15;
      --font: "Be Vietnam Pro", "Pretendard", "Apple SD Gothic Neo", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 390px;
      min-width: 390px;
      height: 844px;
      min-height: 844px;
      margin: 0;
      overflow: hidden;
      background: var(--canvas);
    }

    body {
      color: var(--text);
      font-family: var(--font);
    }

    .onboarding-screen {
      position: relative;
      display: flex;
      flex-direction: column;
      width: 390px;
      height: 844px;
      overflow: hidden;
      background: var(--canvas);
    }

    .skip-link {
      position: absolute;
      top: 28px;
      right: 24px;
      z-index: 2;
      min-width: 64px;
      min-height: 44px;
      padding: 12px 0;
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
      line-height: 20px;
      text-align: right;
      text-decoration: none;
    }

    .screen-content {
      display: flex;
      flex: 1;
      flex-direction: column;
      min-height: 0;
      padding: 88px 24px 24px;
    }

    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .map-visual {
      width: calc(100% + 48px);
      height: 286px;
      margin: 0 -24px;
      overflow: hidden;
      background: var(--surface);
    }

    .map-visual img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .copy {
      width: 100%;
      margin-top: 36px;
      text-align: center;
    }

    .title {
      margin: 0;
      color: var(--text);
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -1.2px;
      line-height: 1.3;
      word-break: keep-all;
    }

    .description {
      margin: 16px 0 0;
      color: var(--muted);
      font-size: 16px;
      font-weight: 400;
      letter-spacing: -0.35px;
      line-height: 1.65;
      word-break: keep-all;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 24px;
      margin-top: auto;
    }

    .indicators {
      display: flex;
      justify-content: center;
      gap: 10px;
      height: 10px;
    }

    .indicator {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--inactive);
    }

    .indicator.is-active {
      background: var(--accent);
    }

    .primary-button {
      width: 100%;
      min-height: 58px;
      border: 0;
      border-radius: 14px;
      background: var(--accent);
      color: var(--button-text);
      font: inherit;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.4px;
      line-height: 24px;
    }

    .button-arrow {
      display: inline-block;
      margin-left: 8px;
      font-size: 26px;
      line-height: 0;
      vertical-align: -2px;
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
    }
  </style>
</head>
