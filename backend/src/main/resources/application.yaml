spring:
  application:
    name: mapmory-backend
  mvc:
    problemdetails:
      enabled: true
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
    open-in-view: false
  http:
    clients:
      connect-timeout: 2s
      read-timeout: 3s

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

jwt:
  # 서명 키(jwt.secret)는 프로파일별로 주입한다. (local: application-local, prod: 환경변수)
  access-token-validity: PT30M
  refresh-token-validity: P14D

kakao:
  user-info-uri: https://kapi.kakao.com/v2/user/me

upload:
  policy:
    max-file-size: 10MB
    max-files-per-request: 10
    presigned-url-expiration: PT5M
  storage:
    s3:
      bucket: ${AWS_S3_BUCKET:mapmory-local}
      region: ${AWS_REGION:ap-northeast-2}

server:
  port: 8080
  servlet:
    context-path: /

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"
  level:
    org.hibernate.SQL: debug
    org.flywaydb: debug
    org.springframework.boot.autoconfigure: debug

management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        include:
          - health
          - prometheus
      discovery:
        enabled: false

  endpoint:
    health:
      access: read-only
      show-details: never
    prometheus:
      access: read-only

  metrics:
    tags:
      service: ${spring.application.name}
      version: ${APP_VERSION:unknown}

    distribution:
      minimum-expected-value:
        http.server.requests: 10ms
      maximum-expected-value:
        http.server.requests: 5s
      slo:
        http.server.requests: 100ms,300ms,500ms,1s,2s,3s,5s
