spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/mapmory?serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000

logging:
  level:
    org.hibernate.SQL: warn