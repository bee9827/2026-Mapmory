version: 0.0
os: linux

files:
  - source: mapmory-backend.jar
    destination: /opt/mapmory

file_exists_behavior: OVERWRITE

hooks:
  ApplicationStop:
    - location: scripts/stop.sh
      timeout: 60
      runas: root

  ApplicationStart:
    - location: scripts/start.sh
      timeout: 60
      runas: root

  ValidateService:
    - location: scripts/health-check.sh
      timeout: 180
      runas: root