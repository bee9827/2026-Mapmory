services:
  db:
    image: mysql:8.4
    container_name: mapmory-local-db
    environment:
      MYSQL_DATABASE: mapmory
      MYSQL_ROOT_PASSWORD: local
    ports:
      - "3306:3306"
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
      --default-time-zone=+00:00
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data: