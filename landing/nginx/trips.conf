# Merge only these locations into the EXISTING map-mory.com HTTPS server block.
# Reviewed configuration example; neither the build nor CodeDeploy applies it.
# Preserve the current root, TLS, API, /recap/ and homepage locations.
location = /trips {
    return 308 /trips/$is_args$args;
}
location = /trips/ {
    add_header Cache-Control "no-cache" always;
    try_files /trips/index.html =404;
}
location ^~ /trips/ {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}
